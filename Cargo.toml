[package]
name = "plugin_matter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
# The plugin's descriptor and its editor provider's registration.
pulsar_plugins = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "380707ef2a6b6d0e3e7ff3cfc827b10c0a093e6b" }
plugin_manager = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "380707ef2a6b6d0e3e7ff3cfc827b10c0a093e6b" }
profiling = { path = "../../../crates/profiling" }
# GPUI Framework
gpui-ce = { git = "https://github.com/Far-Beyond-Pulsar/WGPUI", rev = "31fbf35800b4cfc2ddf202a1c16a2971251ca84c" }
ui      = { git = "https://github.com/Far-Beyond-Pulsar/WGPUI-Component", rev = "eda5213258be50bf5a9556ff9a68221bd5f449cd" }

# The host's editor API: the shared undo history and its Undo/Redo actions
# (Pulsar-Native#931), and the editor menu strip (#1012).
plugin_editor_api = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "380707ef2a6b6d0e3e7ff3cfc827b10c0a093e6b" }

# PIF Image Format
pulsar_image_format = { git = "https://github.com/Far-Beyond-Pulsar/PIF-rs", rev = "c2cd8c4dfc49e12bebd76812308a7dda1f851452" }

# Graphics
wgpu = { version = "30", default-features = false, features = ["dx12", "vulkan", "wgsl", "metal"] }

# Image decoding (PNG brush masks) — version pinned to match existing lock file
image = { version = "=0.25.10", default-features = false, features = ["png"] }

# SVG rasterisation for brush masks — version pinned to match existing lock file
resvg = "=0.47.0"

# Utilities
anyhow = "1.0"
parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
rust-i18n = "=4.2.1"
rust-i18n-macro = "=4.2.1"
rust-i18n-support = "=4.2.1"

[build-dependencies]
rustc_version = "0.4"

[features]
plugin = []

# Resolve GPUI through the same Pulsar revision as plugin_editor_api, so its
# public types keep one package identity in a standalone build. (Inside
# Pulsar-Native the workspace's own [patch] maps these to its checkout.)
[patch."https://github.com/Far-Beyond-Pulsar/WGPUI"]
gpui-ce = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "380707ef2a6b6d0e3e7ff3cfc827b10c0a093e6b" }

[patch."https://github.com/Far-Beyond-Pulsar/WGPUI-Component"]
ui = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "380707ef2a6b6d0e3e7ff3cfc827b10c0a093e6b" }
ui-macros = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "380707ef2a6b6d0e3e7ff3cfc827b10c0a093e6b" }

# Public reflection types must come from the same published Pulsar snapshot
# as ui_common, the VM and the scene registry. Local host integration belongs
# in the explicit --config file, never in the standalone dependency graph.
[patch."https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection"]
pulsar_reflection = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "380707ef2a6b6d0e3e7ff3cfc827b10c0a093e6b" }
pulsar_reflection_derive = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "380707ef2a6b6d0e3e7ff3cfc827b10c0a093e6b" }
pulsar_reflection_codegen = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "380707ef2a6b6d0e3e7ff3cfc827b10c0a093e6b" }

# Mirror the SceneDB revision inherited by the pinned Pulsar workspace.
[patch."https://github.com/Far-Beyond-Pulsar/SceneDB"]
pulsar_scenedb = { git = "https://github.com//Far-Beyond-Pulsar/SceneDB", rev = "017252c3c84331a29e53eaa627185597954a3241" }
pulsar_scenedb_derive = { git = "https://github.com//Far-Beyond-Pulsar/SceneDB", rev = "017252c3c84331a29e53eaa627185597954a3241" }

# Cargo only applies patches from the invocation root. Helio builds on the
# same wgpu fork branch as the pinned Pulsar workspace (its [patch.crates-io]).
[patch.crates-io]
naga = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-core = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-core-deps-apple = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-core-deps-emscripten = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-hal = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-naga-bridge = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-types = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
