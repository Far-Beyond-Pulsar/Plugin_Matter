[package]
name = "plugin_matter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
engine_fs = { workspace = true }
# The plugin's descriptor and its editor provider's registration.
pulsar_plugins = { workspace = true }
plugin_manager = { workspace = true }
profiling = { workspace = true }
# GPUI Framework
gpui-ce = { workspace = true }
ui      = { workspace = true }

# The host's editor API: the shared undo history and its Undo/Redo actions
# (Pulsar-Native#931), and the editor menu strip (#1012).
plugin_editor_api = { workspace = true }

# PIF Image Format
pulsar_image_format = { git = "https://github.com/Far-Beyond-Pulsar/PIF-rs", rev = "c2cd8c4dfc49e12bebd76812308a7dda1f851452" }

# Graphics
wgpu = { version = "30", default-features = false, features = ["dx12", "vulkan", "wgsl", "metal"] }

# Image decoding (PNG brush masks) — version pinned to match existing lock file
image = { version = "=0.25.10", default-features = false, features = ["png"] }

# SVG rasterisation for brush masks — version pinned to match existing lock file
resvg = "=0.47.0"

# Utilities
anyhow = "1.0"
parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
rust-i18n = "=4.2.1"
rust-i18n-macro = "=4.2.1"
rust-i18n-support = "=4.2.1"

[build-dependencies]
rustc_version = "0.4"

[features]
plugin = []

[lints]
workspace = true
